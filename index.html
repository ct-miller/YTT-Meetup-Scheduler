<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group Availability Scheduler</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    h1 { margin-top: 20px; }
    .controls { margin-top: 10px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; max-width: 1000px; margin: 20px auto; }
    .day { border: 1px solid #ccc; padding: 14px; border-radius: 10px; min-height: 140px; }
    .past { background: #f0f0f0; opacity: 0.6; }
    .hidden { display: none; }
    .weekday { font-size: 12px; font-weight: bold; }
    .date { font-size: 14px; margin-bottom: 6px; }
    .times { margin-top: 5px; }
    .times label { display: block; font-size: 12px; margin: 2px 0; }
    input, textarea { padding: 8px; margin: 10px; }
    textarea { width: 80%; max-width: 500px; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
    .results { margin-top: 20px; text-align: left; max-width: 700px; margin-left: auto; margin-right: auto; }
    .best { background: #c8f7c5; padding: 5px; border-radius: 5px; }
    .all-day { font-size: 12px; margin-top: 5px; display: block; }
  </style>
</head>
<body>

<h1>Group Availability Scheduler</h1>
<p>Enter your name, notes, and select availability:</p>

<input type="text" id="name" placeholder="Your name" />
<br>
<textarea id="notes" placeholder="Add any notes (optional)..."></textarea>

<div class="controls">
  <label>
    <input type="checkbox" id="weekendToggle"> Show weekends only
  </label>
</div>

<div class="calendar" id="calendar"></div>

<button onclick="submitAvailability()">Submit Availability</button>

<div class="results">
  <h2>Group Results</h2>
  <div id="output"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAl6ZcsV9ZqG1_yTB9qccTKCOSm9ZDDNvY",
    authDomain: "ytt-meetup-scheduler.firebaseapp.com",
    projectId: "ytt-meetup-scheduler",
    storageBucket: "ytt-meetup-scheduler.firebasestorage.app",
    messagingSenderId: "691109600721",
    appId: "1:691109600721:web:cbed304948fcc8dcf054f0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const calendar = document.getElementById('calendar');
  const weekendToggle = document.getElementById('weekendToggle');

  const weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const timeSlots = [
    "08:00–12:00",
    "12:00–16:00",
    "16:00–22:00"
  ];

  // Auto-set to current month
  const now = new Date();
  const year = now.getFullYear();
  const monthIndex = now.getMonth(); // 0 = Jan, 11 = Dec

  const start = new Date(year, monthIndex, 1);
  const end = new Date(year, monthIndex + 1, 0);   // April 30

  const dayElements = [];

  // Add leading blanks so calendar starts on Monday
  const firstDayIndex = (start.getDay() + 6) % 7; // convert Sunday=0 to Monday=0

  for (let i = 0; i < firstDayIndex; i++) {
    const empty = document.createElement('div');
    empty.className = 'day';
    empty.style.visibility = 'hidden';
    calendar.appendChild(empty);
  }

  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const date = new Date(d);

    const key = date.toISOString().split('T')[0];
    const weekdayIndex = (date.getDay() + 6) % 7;
    const weekday = weekdays[weekdayIndex];
    const month = date.toLocaleString('default', { month: 'short' });
    const dayNum = date.getDate();

    const div = document.createElement('div');
    div.className = 'day';
    div.dataset.weekdayIndex = weekdayIndex;

    let timesHTML = '';
    timeSlots.forEach(slot => {
      timesHTML += `<label><input type="checkbox" data-date="${key}" data-time="${slot}"> ${slot}</label>`;
    });

    div.innerHTML = `
      <div class="weekday">${weekday}</div>
      <div class="date">${month} ${dayNum}</div>
      <label class="all-day">
        <input type="checkbox" data-allday="${key}"> All Day
      </label>
      <div class="times">${timesHTML}</div>
    `;

    div.querySelector(`[data-allday="${key}"]`).addEventListener('change', (e) => {
      const checked = e.target.checked;
      div.querySelectorAll('input[data-time]').forEach(c => c.checked = checked);
    });

        // Grey out past dates
    const today = new Date();
    today.setHours(0,0,0,0);
    if (date < today) {
      div.classList.add('past');
      div.querySelectorAll('input').forEach(i => i.disabled = true);
    }

    calendar.appendChild(div);
    dayElements.push(div);
  }

  weekendToggle.addEventListener('change', () => {
    const showWeekends = weekendToggle.checked;
    dayElements.forEach(div => {
      const idx = parseInt(div.dataset.weekdayIndex);
      const isWeekend = (idx === 5 || idx === 6);
      div.classList.toggle('hidden', showWeekends ? !isWeekend : false);
    });
  });

  window.submitAvailability = async function () {
    const name = document.getElementById('name').value.trim();
    const notes = document.getElementById('notes').value.trim();
    if (!name) return alert('Enter your name');

    const checks = document.querySelectorAll('input[data-time]:checked');

    const entries = [];
    checks.forEach(c => {
      entries.push({ date: c.dataset.date, time: c.dataset.time });
    });

    await addDoc(collection(db, "availability"), {
      name,
      notes,
      entries
    });

    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    document.getElementById('name').value = '';
    document.getElementById('notes').value = '';
  }

  const output = document.getElementById('output');

  onSnapshot(collection(db, "availability"), (snapshot) => {
    const predefinedNames = ["Christina","Jacob","Marlowe","Emily","Racheal","Jackie","Elma","Danielle","Shannon"].sort();
    const people = [];
    const dateSet = new Set();
    const availabilityMap = {}; // name -> set of date|time

    snapshot.forEach(doc => {
      const data = doc.data();
      const name = data.name;
      if (!availabilityMap[name]) {
        availabilityMap[name] = new Set();
      }

      data.entries.forEach(entry => {
        const key = `${entry.date}|${entry.time}`;
        availabilityMap[name].add(key);
        dateSet.add(key);
      });
    });

    // Ensure all predefined names exist
    predefinedNames.forEach(n => {
      if (!availabilityMap[n]) {
        availabilityMap[n] = new Set();
      }
    });

    // Use predefined alphabetical list
    const peopleList = predefinedNames;
    });

    const dates = Array.from(dateSet).sort();

    if (dates.length === 0) {
      // Still show names even if no one submitted yet
      let html = '<table border="1" style="border-collapse: collapse; width: 100%; text-align: center;">';
      html += '<tr><th>Name</th><th>No availability submitted yet</th></tr>';

      peopleList.forEach(name => {
        html += `<tr><td><strong>${name}</strong></td><td></td></tr>`;
      });

      html += '</table>';
      output.innerHTML = html;
      return;
    }

    // Build table
    let html = '<table border="1" style="border-collapse: collapse; width: 100%; text-align: center;">';

    // Header row
    html += '<tr><th>Name</th>';
    dates.forEach(key => {
      const dateStr = key.substring(0, 10);
      const time = key.substring(11);
      const d = new Date(dateStr);
      const weekday = weekdays[(d.getDay() + 6) % 7];
      const month = d.toLocaleString('default', { month: 'short' });
      const dayNum = d.getDate();

      html += `<th>${weekday}<br>${month} ${dayNum}<br><small>${time}</small></th>`;
    });
    html += '</tr>';

    // Rows per person
    peopleList.forEach(name => {
      html += `<tr><td><strong>${name}</strong></td>`;

      dates.forEach(key => {
        const has = availabilityMap[name].has(key);
        html += `<td>${has ? '✓' : ''}</td>`;
      });

      html += '</tr>';
    });

    html += '</table>';

    output.innerHTML = html;
  });
</script>

</body>
</html>
